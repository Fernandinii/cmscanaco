{% extends 'home/base.html' %}
{% load static %}

{% block title %}Canaco - Iniciar sesión{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Iniciar sesión</h2>
                        <form action="{% url 'home:login' %}" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" id="username" name="username" class="form-control" placeholder="Tu usuario" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Tu contraseña" required>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg">INGRESAR</button>
                            </div>
                            <p class="text-center mb-0">¿No tienes cuenta? <a href="{% url 'home:sign_up' %}">CREAR CUENTA</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
