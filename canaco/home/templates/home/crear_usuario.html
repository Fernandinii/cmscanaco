{% extends 'home/base.html' %}
{% load static %}

{% block title %}Canaco - Crear Usuario{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h2 class="mb-4">Crear Usuario</h2>
        <div class="row">
            {% include 'partials/sidebar_backoffice.html' %}
            <div class="col-lg-9">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <form action="{% if usuario_editado %}{% url 'home:editar_usuario' pk=usuario_editado.pk %}{% else %}{% url 'home:crear_usuario' %}{% endif %}" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" id="username" name="username" class="form-control" placeholder="Nombre de usuario" {% if usuario_editado %}value="{{ usuario_editado.username }}"{% endif %} required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="tucorreo@ejemplo.com" {% if usuario_editado %}value="{{ usuario_editado.email }}"{% endif %} required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label for="first_name" class="form-label">Nombre</label>
                                    <input type="text" id="first_name" name="first_name" class="form-control" {% if usuario_editado %}value="{{ usuario_editado.first_name }}"{% endif %} required>
                                </div>
                                <div class="col-md-4">
                                    <label for="apellido_paterno" class="form-label">Paterno</label>
                                    <input type="text" id="apellido_paterno" name="apellido_paterno" class="form-control" {% if perfil_editado %}value="{{ perfil_editado.apellido_paterno }}"{% endif %} required>
                                </div>
                                <div class="col-md-4">
                                    <label for="apellido_materno" class="form-label">Materno</label>
                                    <input type="text" id="apellido_materno" name="apellido_materno" class="form-control" {% if perfil_editado %}value="{{ perfil_editado.apellido_materno }}"{% endif %} required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="rol" class="form-label">Rol</label>
                                <select id="rol" name="rol" class="form-select" required>
                                    <option value="colaborador">Colaborador</option>
                                    <option value="editor">Editor</option>
                                    <option value="administrador">Administrador</option>
                                </select>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="password1" class="form-label">Contraseña</label>
                                    <input type="password" id="password1" name="password1" class="form-control" {% if not usuario_editado %}required{% endif %}>
                                </div>
                                <div class="col-md-6">
                                    <label for="password2" class="form-label">Confirmar contraseña</label>
                                    <input type="password" id="password2" name="password2" class="form-control" {% if not usuario_editado %}required{% endif %}>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">{% if usuario_editado %}GUARDAR CAMBIOS{% else %}CREAR USUARIO{% endif %}</button>
                                <a href="{% url 'home:crud_usuarios' %}" class="btn btn-outline-secondary">VOLVER A USUARIOS</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
