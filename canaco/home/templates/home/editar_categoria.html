{% extends 'partials/sidebar_base.html' %}
{% load static %}
{% block title %}Editar Categoría - Panel Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="mb-4 pb-3 border-bottom">
            <h1 class="h3 fw-bold mb-1" style="font-family: 'Playfair Display', serif;">Editar Categoría</h1>
            <p class="text-muted small mb-0">Actualiza el nombre de la categoría seleccionada.</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="nombre" class="form-label small fw-medium">Nombre de la categoría</label>
                <input type="text" id="nombre" name="nombre" class="form-control rounded-3 py-2" value="{{ categoria.nombre }}" required>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'home:crud_categoria' %}" class="btn btn-outline-secondary rounded-pill px-4">Cancelar</a>
                <button type="submit" class="btn btn-primary rounded-pill px-4">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
