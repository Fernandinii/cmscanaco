{% extends 'home/base.html' %}
{% load static %}

{% block title %}Canaco - Editar Categoría{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h2 class="mb-4">Editar Categoría</h2>
        <div class="row">
            {% include 'partials/sidebar_backoffice.html' %}
            <div class="col-lg-9">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <form action="#" method="post">
                            {% csrf_token %}
                            <div class="mb-4">
                                <label for="nombre" class="form-label">Nombre de la categoría</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" value="Comercio" required>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">GUARDAR CAMBIOS</button>
                                <a href="{% url 'home:crud_categorias' %}" class="btn btn-outline-secondary">CANCELAR</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
