{% extends 'home/base.html' %}
{% load static %}

{% block title %}Canaco - Registrarse{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Crear cuenta</h2>
                        <form action="{% url 'home:sign_up' %}" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" id="username" name="username" class="form-control" placeholder="Tu usuario" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo</label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="tucorreo@ejemplo.com" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label for="first_name" class="form-label">Nombre</label>
                                    <input type="text" id="first_name" name="first_name" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="apellido_paterno" class="form-label">Paterno</label>
                                    <input type="text" id="apellido_paterno" name="apellido_paterno" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="apellido_materno" class="form-label">Materno</label>
                                    <input type="text" id="apellido_materno" name="apellido_materno" class="form-control" required>
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="password1" class="form-label">Contraseña</label>
                                    <input type="password" id="password1" name="password1" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="password2" class="form-label">Confirmar contraseña</label>
                                    <input type="password" id="password2" name="password2" class="form-control" required>
                                </div>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg">REGISTRARSE</button>
                            </div>
                            <p class="text-center mb-0">¿Ya tienes cuenta? <a href="{% url 'home:login' %}">YA TENGO CUENTA</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
