{% extends 'home/base.html' %}
{% load static %}

{% block title %}Canaco - Registrarse{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Crear cuenta</h2>
                        <form action="#" method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="usuario" class="form-label">Usuario</label>
                                <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Tu usuario" required>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo</label>
                                <input type="email" id="correo" name="correo" class="form-control" placeholder="tucorreo@ejemplo.com" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" id="nombre" name="nombre" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="paterno" class="form-label">Paterno</label>
                                    <input type="text" id="paterno" name="paterno" class="form-control" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="materno" class="form-label">Materno</label>
                                    <input type="text" id="materno" name="materno" class="form-control" required>
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="contrasena" class="form-label">Contraseña</label>
                                    <input type="password" id="contrasena" name="contrasena" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirmar" class="form-label">Confirmar contraseña</label>
                                    <input type="password" id="confirmar" name="confirmar" class="form-control" required>
                                </div>
                            </div>
                            <div class="d-grid mb-3">
                                <button type="submit" class="btn btn-primary btn-lg">REGISTRARSE</button>
                            </div>
                            <p class="text-center mb-0">¿Ya tienes cuenta? <a href="{% url 'home:login' %}">YA TENGO CUENTA</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
