{% extends 'home/base.html' %}
{% load static %}

{% block title %}Canaco - Editar Mi Perfil{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h2 class="mb-4">Editar Mi Perfil</h2>
        <div class="row">
            {% include 'partials/sidebar_backoffice.html' %}
            <div class="col-lg-9">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <form action="#" method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="usuario" class="form-label">Usuario</label>
                                <input type="text" id="usuario" name="usuario" class="form-control" value="admin" required>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo</label>
                                <input type="email" id="correo" name="correo" class="form-control" value="admin@canaco.com" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" id="nombre" name="nombre" class="form-control" value="David" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="paterno" class="form-label">Paterno</label>
                                    <input type="text" id="paterno" name="paterno" class="form-control" value="Anderson" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="materno" class="form-label">Materno</label>
                                    <input type="text" id="materno" name="materno" class="form-control" value="Rodríguez" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="foto" class="form-label">Foto</label>
                                <input type="file" id="foto" name="foto" class="form-control">
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">GUARDAR CAMBIOS</button>
                                <a href="{% url 'home:perfil' %}" class="btn btn-outline-secondary">CANCELAR</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
