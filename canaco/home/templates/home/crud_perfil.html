{% extends 'home/base.html' %}
{% load static %}

{% block title %}Canaco - Editar Mi Perfil{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h2 class="mb-4">Editar Mi Perfil</h2>
        <div class="row">
            {% include 'partials/sidebar_backoffice.html' %}
            <div class="col-lg-9">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <form action="{% url 'home:crud_perfil' %}" method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" id="username" name="username" class="form-control" value="{{ request.user.username }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo</label>
                                <input type="email" id="email" name="email" class="form-control" value="{{ request.user.email }}" required>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label for="first_name" class="form-label">Nombre</label>
                                    <input type="text" id="first_name" name="first_name" class="form-control" value="{{ request.user.first_name }}" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="apellido_paterno" class="form-label">Paterno</label>
                                    <input type="text" id="apellido_paterno" name="apellido_paterno" class="form-control" value="{{ perfil_usuario.apellido_paterno }}" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="apellido_materno" class="form-label">Materno</label>
                                    <input type="text" id="apellido_materno" name="apellido_materno" class="form-control" value="{{ perfil_usuario.apellido_materno }}" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="foto" class="form-label">Foto</label>
                                <input type="file" id="foto" name="foto" class="form-control">
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">GUARDAR CAMBIOS</button>
                                <a href="{% url 'home:perfil' %}" class="btn btn-outline-secondary">CANCELAR</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
