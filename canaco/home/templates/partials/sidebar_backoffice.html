{% load static %}
<aside class="col-lg-3 mb-4 mb-lg-0">
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img src="{% static 'images/person_1.jpg' %}" alt="Avatar" class="img-fluid rounded-circle" style="width: 90px; height: 90px; object-fit: cover;">
                <h5 class="mt-3 mb-0">{{ request.user.username }}</h5>
                <span class="badge bg-primary">{% if request.user.is_superuser %}Administrador{% elif request.user.is_staff %}Editor{% else %}Colaborador{% endif %}</span>
            </div>
            <ul class="nav flex-column list-unstyled mb-0">
                <li class="nav-item border-bottom">
                    <a class="nav-link d-block py-3 {% if request.resolver_match.url_name == 'perfil' %}active fw-bold text-primary{% endif %}" href="{% url 'home:perfil' %}">
                        <i class="bi bi-person me-2"></i>Mi Perfil
                    </a>
                </li>
                <li class="nav-item border-bottom">
                    <a class="nav-link d-block py-3 {% if request.resolver_match.url_name == 'crud_noticias' or request.resolver_match.url_name == 'crear_publicacion' or request.resolver_match.url_name == 'editar_publicacion' %}active fw-bold text-primary{% endif %}" href="{% url 'home:crud_noticias' %}">
                        <i class="bi bi-newspaper me-2"></i>Noticias
                    </a>
                </li>
                <li class="nav-item border-bottom">
                    <a class="nav-link d-block py-3 {% if request.resolver_match.url_name == 'crud_comentarios' %}active fw-bold text-primary{% endif %}" href="{% url 'home:crud_comentarios' %}">
                        <i class="bi bi-chat-dots me-2"></i>Comentarios
                    </a>
                </li>
                <li class="nav-item border-bottom">
                    <a class="nav-link d-block py-3 {% if request.resolver_match.url_name == 'crud_categorias' or request.resolver_match.url_name == 'editar_categoria' %}active fw-bold text-primary{% endif %}" href="{% url 'home:crud_categorias' %}">
                        <i class="bi bi-bookmark me-2"></i>Categorías
                    </a>
                </li>
                <li class="nav-item border-bottom">
                    <a class="nav-link d-block py-3 {% if request.resolver_match.url_name == 'crud_usuarios' or request.resolver_match.url_name == 'crear_usuario' %}active fw-bold text-primary{% endif %}" href="{% url 'home:crud_usuarios' %}">
                        <i class="bi bi-people me-2"></i>Usuarios
                    </a>
                </li>
                <li class="nav-item border-bottom">
                    <a class="nav-link d-block py-3 {% if request.resolver_match.url_name == 'crud_cambiar_contrasena' %}active fw-bold text-primary{% endif %}" href="{% url 'home:crud_cambiar_contrasena' %}">
                        <i class="bi bi-key me-2"></i>Cambiar contraseña
                    </a>
                </li>
                <li class="nav-item">
                    <form action="{% url 'home:logout' %}" method="post" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="nav-link d-block w-100 border-0 bg-transparent text-danger text-start py-3" style="cursor: pointer;">
                            <i class="bi bi-box-arrow-right me-2"></i>CERRAR SESIÓN
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</aside>
