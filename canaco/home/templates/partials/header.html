{% load static %}
<nav class="site-nav">
    <div class="container">
        <div class="menu-bg-wrap">
            <div class="site-navigation">
                <div class="row g-0 align-items-center">
                    <div class="col-2">
                        <a href="{% url 'home:index' %}" class="logo m-0 float-start">Canaco<span class="text-primary">.</span></a>
                    </div>
                    <div class="col-8 text-center">
                        <ul class="js-clone-nav d-none d-lg-inline-block text-start site-menu mx-auto">
                            <li {% if request.resolver_match.url_name == 'index' %}class="active"{% endif %}><a href="{% url 'home:index' %}">Inicio</a></li>
                            <li {% if request.resolver_match.url_name == 'categoria' %}class="active"{% endif %}><a href="{% url 'home:categoria' %}">Categorías</a></li>
                            <li {% if request.resolver_match.url_name == 'noticia' %}class="active"{% endif %}><a href="{% url 'home:noticia' %}">Noticias</a></li>
                            {% if user.is_authenticated %}
                                <li class="has-children {% if request.resolver_match.url_name == 'perfil' or request.resolver_match.url_name == 'crear_publicacion' %}active{% endif %}">
                                    <a href="#">Cuenta</a>
                                    <ul class="dropdown">
                                        <li><a href="{% url 'home:perfil' %}">Perfil</a></li>
                                        <li><a href="{% url 'home:crear_publicacion' %}">Crear publicación</a></li>
                                    </ul>
                                </li>
                            {% else %}
                                <li {% if request.resolver_match.url_name == 'login' %}class="active"{% endif %}><a href="{% url 'home:login' %}">Iniciar sesión</a></li>
                                <li {% if request.resolver_match.url_name == 'sign_up' %}class="active"{% endif %}><a href="{% url 'home:sign_up' %}">Registrarse</a></li>
                            {% endif %}
                        </ul>
                    </div>
                    <div class="col-2 text-end">
                        <a href="#" class="burger ms-auto float-end site-menu-toggle js-menu-toggle d-inline-block d-lg-none light">
                            <span></span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>
